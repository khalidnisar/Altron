[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "altron-quant"
version = "0.1.0"
description = "Modular multi-asset research, walk-forward optimization, and paper-trading platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Altron contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
data = ["ccxt>=4.3", "yfinance>=0.2.40", "pyarrow>=15", "websockets>=13"]
optimize = ["optuna>=3.6,<5"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
dashboard = ["streamlit>=1.34", "plotly>=5.20"]
vectorbt = ["vectorbt>=0.26"]
mt5 = ["MetaTrader5>=5.0; platform_system == 'Windows'"]
desktop = [
  "PySide6>=6.7,<7",
  "keyring>=25,<27",
  "platformdirs>=4.2,<5",
]
windows-build = ["pyinstaller>=6.10,<7"]
all = [
  "ccxt>=4.3", "yfinance>=0.2.40", "pyarrow>=15", "websockets>=13",
  "optuna>=3.6,<5", "fastapi>=0.110", "uvicorn[standard]>=0.29",
  "httpx>=0.27", "streamlit>=1.34", "plotly>=5.20"
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
altron = "altron.cli:main"
altron-desktop = "altron.desktop.app:main"

[project.entry-points."altron.strategies"]
# Third-party packages can expose Strategy subclasses in this group.

[tool.hatch.build.targets.wheel]
packages = ["src/altron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

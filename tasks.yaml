# Altron Hybrid Multi-Agent Orchestration Task Board
#
# HYBRID MODEL RULES:
# 1. Claude ALWAYS plans the work first.
# 2. Claude distributes LONG but EASY tasks to sub-agents.
# 3. Claude keeps ~30-40% of the DIFFICULT / complex parts for itself.
# 4. Each sub-agent works on ONE task at a time.
# 5. If agent fails or gets stuck after 3 retries → Claude ESCALATES and finishes it.
#
# Status: pending | running | needs_review | done | failed | conflict | escalated
# difficulty: easy | medium | hard
# retry_count: auto-incremented by orchestrator
# escalated: true = Claude is now doing this task directly
# owner: "opencode" | "cursor" | "hermes" | "claude"


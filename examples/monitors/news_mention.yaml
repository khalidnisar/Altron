# Example: watch a news search results page and alert whenever a keyword
# like "sale" or "launch" appears. This monitor uses the regex extractor
# to pull a price out of the matched snippet.

name: news_mention
url: https://news.example.com/search?q=acme+launch
interval: 1h
keywords:
  - sale
  - launch
  - pre-order
regex: '\$\s?[0-9]+(?:\.[0-9]{2})?'
diff:
  full_page_hash: false  # keyword + regex are enough; ignore cosmetic page changes
  min_change_chars: 0
notify:
  - email
  - telegram
quiet_hours: "23:00-07:00"
cooldown_seconds: 3600
